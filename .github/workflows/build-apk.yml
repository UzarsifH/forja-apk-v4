name: Build Forja APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # دریافت دقیق همان Commit فعلی GitHub
      - name: Checkout source
        uses: actions/checkout@v4

      # Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # JDK 21 برای Capacitor/Android
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # نصب وابستگی‌ها
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # بررسی TypeScript
      - name: TypeScript check
        run: npm run typecheck

      # ساخت نسخه Web
      - name: Build web app
        run: npm run build

      # اگر Android وجود نداشت، بساز
      - name: Create Android project if needed
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "Android project not found. Creating it..."
            npx cap add android
          else
            echo "Android project already exists."
          fi

      # همگام‌سازی Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # اطمینان از executable بودن Gradle
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      # ساخت APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # نمایش مسیر APK
      - name: Verify APK
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      # تحویل APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forja-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
